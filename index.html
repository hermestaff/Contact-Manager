<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Contact Manager</title>
    <script src="script.js" defer></script>
    <script src="https://kit.fontawesome.com/dd8c49730d.js" crossorigin="anonymous"></script>
    <script async defer src="https://buttons.github.io/buttons.js"></script>
</head>
<body>
    <label class="theme-switch">
        <input type="checkbox" id="theme-toggle">
        <span class="theme-slider"></span>
        <span>Dark Mode</span>
    </label>
</div>
    <main>
        <div class="container row">
            <section class="ListContainer column">
                <div id="people" class="contact_list"></div>
                </section>
            <br>
            <form autocomplete="off" class="js-form column">
                <div class="name">
                    <i class="far fa-user"></i>
                    <input type="text" required id="fullName" placeholder="Enter The Name" />
                </div>
                <div class="email">
                    <i class="fas fa-at"></i>
                    <input type="email" required id="myEmail" placeholder="Enter The Email" />
                </div>
                <div class="number">
                    <i class="fas fa-phone"></i>
                    <input type="tel" required id="myTel" placeholder="Enter The Phone Number" />
                </div>
                <div class="img">
                    <i class="far fa-image"></i>
                    <input type="url" required id="imgurl" placeholder="Enter The Image URL" />
                </div>
                <button type="submit" class="submitbtn">Add Contact</button>
            </form>
        
        </div>
    </main>
     <script>
        const toggleSwitch=document.querySelector('.theme-switch input[type="checkbox"]');
        const currentTheme=localStorage.getItem('theme');
        if(currentTheme){
            document.documentElement.setAttribute('data-theme',currentTheme);
            if(currentTheme==='dark'){
                toggleSwitch.checked=true;
            }
        }
        function switchTheme(e){
            if(e.target.checked){
                document.documentElement.setAttribute('data-theme','dark');
                localStorage.setItem('theme','dark');
            }else{
                document.documentElement.setAttribute('data-theme','light');
                localStorage.setItem('theme','light');
            }
        }
        toggleSwitch.addEventListener('change',switchTheme,false);
    </script>
</body>
</html>
